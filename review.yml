aid: tal-australia
name: TAL
review:
  question: Does TAL publish a public, self-serve developer portal or downloadable
    API definitions for its Australian life insurance business?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: carrier-life-health
findings:
  summary: |
    TAL, Australia's largest life insurer, publishes no public developer portal,
    no API reference, and no downloadable API definitions. Every candidate
    developer hostname was probed on 2026-07-25 and either failed DNS resolution
    or returned 404. The single non-marketing integration surface is
    adviser.tal.com.au — the TAL Adviser Centre — which is a Sitecore extranet
    for licensed financial advisers, not a developer portal. Unknown paths there
    redirect (302) to /404?item=...&user=extranet%5cAnonymous&site=TAC, which
    confirms an authenticated extranet with an anonymous-user fall-through, and
    the portal's own navigation covers products, Risk Academy training, claims,
    forms and documents, with no API, integration, data feed or standards
    material anywhere on it. Integration with TAL is therefore bilateral and
    relationship-based: adviser quoting and application happen inside the
    gated Adviser Centre, group insurance runs through negotiated
    superannuation-fund arrangements, and embedded distribution runs through
    named partners rather than a self-serve API.
  developerPortal:
    exists: false
    closestSurface: https://adviser.tal.com.au/
    closestSurfaceStatus: 200
    closestSurfaceClassification: partner/agent login wall (Sitecore extranet,
      site=TAC "TAL Adviser Centre"); NOT a developer portal
    gated: true
  hostProbes:
  - url: https://tal.com.au
    status: 200
    note: Redirects to https://www.tal.com.au/ — corporate marketing site.
  - url: https://developer.tal.com.au
    status: 0
    note: DNS does not resolve.
  - url: https://developers.tal.com.au
    status: 0
    note: DNS does not resolve.
  - url: https://docs.tal.com.au
    status: 0
    note: DNS does not resolve.
  - url: https://api.tal.com.au
    status: 404
    note: Host resolves and is served by Azure Front Door (x-azure-ref present),
      returning an empty application/json 404 at root. /openapi.json,
      /openapi.yaml, /swagger.json, /api-docs, /v1, /health and /docs all
      returned 404. This is an internal backend host for TAL's own digital
      properties, not a documented public API.
  - url: https://www.tal.com.au/developers
    status: 404
  - url: https://www.tal.com.au/api
    status: 404
  - url: https://www.tal.com.au/developer
    status: 404
  - url: https://www.tal.com.au/partners
    status: 404
  - url: https://www.tal.com.au/integrations
    status: 404
  - url: https://adviser.tal.com.au/
    status: 200
    note: Live adviser (agent) portal with login. /api, /api-docs and
      /.well-known/openid-configuration all 302 to the extranet 404 handler.
      /openapi.json and /swagger.json return 404.
  - url: https://mytal.tal.com.au/
    status: 302
    note: Customer self-service host; redirects to /500?errorcode=106 without a
      session. No API documentation.
  - url: https://backd.com.au/
    status: 200
    note: backd by TAL (the TAL x Cover Genius embedded product) serves a
      "Coming Soon" placeholder page. Every path including /developers, /api,
      /docs, /openapi.json and /swagger.json returns the same HTML placeholder
      with content-type text/html — no API surface, no spec.
  - url: https://www.tal.com.au/robots.txt
    status: 200
    note: Sitemap at https://www.tal.com.au/sitemap.xml. 556 URLs enumerated; no
      /developers, /api or /docs section exists. Top segments are about-us (281),
      slice-of-life-blog (140), existing-customers (35) and claims (14).
  specifications:
    openapiHarvested: false
    count: 0
    note: No OpenAPI, Swagger, AsyncAPI or .proto artifact is published anywhere
      on a TAL-controlled host. The openapi/ directory is deliberately absent
      from this repo because nothing real was found. The enrichment round on
      2026-07-25 did, however, harvest three machine-readable contracts that the
      first pass missed — see apiEstate below — namely three live OpenID Connect
      discovery documents and a production GraphQL endpoint whose field
      introspection is filtered.
  apiEstate:
    method: certificate-transparency enumeration (crt.sh, 832 distinct names for
      *.tal.com.au) followed by DNS resolution and live HTTP probing on
      2026-07-25
    summary: |
      TAL is not API-less; it is API-private. The corporate hostnames a reviewer
      would guess (developer., docs., api.developer., apicatalog., apiportal.,
      gateway.) all hold TLS certificates but do not resolve in public DNS —
      TAL built and then internalised a developer portal and API catalogue.
      What does resolve is a real partner API estate: an OpenID Connect partner
      identity tenant, a bearer-protected Group Life B2B integration estate, a
      set of per-distributor API hosts (one of them named for the Iress adviser
      software), and a production Underwriting Rules Engine GraphQL endpoint.
      None of it is documented, registrable or self-serve, which is why the
      developer-portal answer above remains false.
    certificatesButNoPublicDNS:
    - developer.tal.com.au
    - api.developer.tal.com.au
    - apicatalog.tal.com.au
    - apiportal.tal.com.au
    - gateway.tal.com.au
    - partner.tal.com.au
    - api.developer.internal.tal.com.au
    - api.internal.tal.com.au
    liveHosts:
    - url: https://login.talpartner.tal.com.au/.well-known/openid-configuration
      status: 200
      note: Full OIDC discovery. Okta org talpartner-au.okta.com. PKCE S256,
        PAR, DPoP, CIBA, device code, introspection, revocation. Harvested to
        well-known/.
    - url: https://login.talpartner.tal.com.au/.well-known/oauth-authorization-server
      status: 200
      note: RFC 8414 authorization-server metadata. Harvested.
    - url: https://auth.acp.tal.com.au/.well-known/openid-configuration
      status: 200
      note: Second TAL Okta tenant (ACP). Harvested.
    - url: https://auth.claimsassist.tal.com.au/.well-known/openid-configuration
      status: 200
      note: Third TAL Okta tenant (TAL Claims Assist). Harvested.
    - url: https://ure-prod-graphql-app.tal.com.au/graphql
      status: 200 on POST (403 on GET)
      note: Underwriting Rules Engine GraphQL. Root query type CaseQuery, no
        mutation or subscription type. Field introspection filtered — types[]
        and fields[] return empty, so no SDL exists to capture.
    - url: https://common.glsb2b.tal.com.au/
      status: 401
      note: 'WWW-Authenticate: Bearer realm="app-b2bcommon-prodmel.azurewebsites.net",
        X-Powered-By ASP.NET. Every discovery path (/swagger, /swagger/v1/swagger.json,
        /openapi.json, /api-docs, /health) also returns 401. A genuine
        OAuth-protected partner API with no anonymous surface.'
    - url: https://delivery.glsb2b.tal.com.au/
      status: 200
      note: Azure Function App default landing page.
    - url: https://uwout.glsb2b.tal.com.au/
      status: 403
      note: Group underwriting outbound. Edge-blocked to non-partner callers.
    - url: https://clpapi.glsb2b.tal.com.au/
      status: 403
    - url: https://iress.api.tal.com.au/
      status: 403
      note: Edge block "Your request has been blocked". The hostname is direct
        evidence of an Iress adviser-software integration seam, which the first
        review could not find because TAL names no third-party software
        publicly.
    - url: https://liferisk.api.tal.com.au/
      status: 403
    - url: https://omnium.api.tal.com.au/
      status: 403
    - url: https://partner.api.tal.com.au/
      status: 0
      note: Resolves to an Azure address (20.53.144.52) but the TCP connection
        times out from the public internet — network-restricted to partners.
    - url: https://www.grouphq.tal.com.au/
      status: 200
      note: TAL Group HQ — the superannuation-partner portal, login-gated. The
        human surface in front of the glsb2b estate.
    - url: https://quote-portal.tal.com.au/
      status: 200
      note: React single-page app titled "EBQ" (employee benefits quoting).
    - url: https://payments.tal.com.au/
      status: 200
      note: React app titled "TAL - Make a Payment".
    - url: https://www.tal.com.au/llms.txt
      status: 200
      note: A real, published llms.txt (71 KB, last modified 2026-06-29) —
        curation for AI crawlers over the marketing sitemap, not an API
        artifact, but the only machine-consumable document TAL publishes to the
        open web. Harvested verbatim to llms/.
    environments: TAL runs dev/dev1-3, ci, qa/qa1-3/qa117, sys1, uat, sandpit,
      spike, preprod and green (blue/green) slots for the developer portal,
      partner API and catalogue hosts. None is a published sandbox.
    brands: The retail platform carries adviser-, asteron- and btlife- host
      families side by side, which is how TAL runs the Asteron Life and BT Life
      books it acquired.
  acordPosture: no ACORD reference found
  acordNote: |
    Searched tal.com.au, adviser.tal.com.au and backd.com.au for ACORD, AL3,
    ACORD XML, NGDS and "ACORD certified" on 2026-07-25 and found zero
    occurrences. This is consistent with the market: ACORD AL3 / IVANS agency
    download is a US property-and-casualty artifact, and Australian life
    insurance instead moves adviser data through commercial planning and
    quoting software (the Iress/XPLAN class of tools) under bilateral
    arrangements. TAL documents no such integration publicly either — it names
    no third-party adviser software on its public adviser-partners page.
  insuranceVerbs:
    quote:
      exposed: false
      note: Quoting exists only inside the gated TAL Adviser Centre ("from
        quoting and application, through to managing existing business and
        making a claim") and in consumer web forms. No public quote API.
    bind:
      exposed: false
    issue:
      exposed: false
    fnol:
      exposed: false
      note: Claims are lodged through www.tal.com.au/claims/make-a-claim web
        forms (including co-branded Westpac and St.George paths) and through the
        adviser portal. No FNOL API is documented.
    audience: agent-facing and partner-only; nothing consumer- or
      developer-facing is exposed programmatically.
  authModel:
    scheme: OpenID Connect / OAuth 2.0 bearer, partner-issued
    selfServe: false
    note: |
      Corrected on 2026-07-25. Neither /.well-known/openid-configuration nor
      /.well-known/oauth-authorization-server is served on www.tal.com.au (404)
      or adviser.tal.com.au (302 to the extranet 404 handler) — but three
      TAL-branded Okta tenants do serve full, anonymous discovery:
      login.talpartner.tal.com.au, auth.acp.tal.com.au and
      auth.claimsassist.tal.com.au. They advertise authorization-code with PKCE
      S256, device code, CIBA, refresh tokens, PAR and DPoP, and the only scopes
      published are the standard OIDC set (openid, profile, email, address,
      phone, offline_access, groups) — no business-domain scopes. The Group Life
      B2B estate is bearer-protected (WWW-Authenticate on common.glsb2b).
      Registration is advertised but not open: there is no self-serve path to a
      client, so the practical auth model remains "sign a partner agreement".
      Captured in authentication/ and scopes/.
  webhooks:
    exists: false
    note: No event catalog, webhook documentation or AsyncAPI definition is
      published. Absence is the finding.
  postman:
    exists: false
    note: No public Postman collection or workspace is linked from any TAL
      property.
  graphql:
    exists: true
    documented: false
    endpoint: https://ure-prod-graphql-app.tal.com.au/graphql
    introspection: filtered
    note: Corrected on 2026-07-25. TAL runs a production GraphQL endpoint for
      its Underwriting Rules Engine. It answers anonymous POSTs and reports
      query root type CaseQuery with no mutation or subscription type, but
      field-level introspection returns empty, so no SDL can be captured and
      none is fabricated. Recorded in graphql/tal-australia-ure-graphql.yml.
  grpc:
    exists: false
  githubOrganization:
    exists: false
    note: https://api.github.com/orgs/tal-australia returns 404 and a GitHub user
      search for TAL life insurance Australia returns zero results. No public
      source presence was identified.
  transports:
  - protocol: REST
    scheme: https
    documented: false
    note: TAL's own web and mobile properties are backed by api.tal.com.au
      (Azure Front Door), but that host is undocumented, unversioned in public,
      and returns 404 to every probed path.
  - protocol: GraphQL
    documented: false
    exists: true
    note: ure-prod-graphql-app.tal.com.au/graphql answers anonymous POSTs; root
      query type CaseQuery; introspection filtered.
  - protocol: WebSocket
    documented: false
  - protocol: AsyncAPI/Events
    documented: false
  - protocol: ACORD/EDI
    documented: false
    note: No ACORD XML, AL3 or NGDS transport is referenced publicly.
  marketSeam: |
    Australia has the legal machinery for open insurance and no live obligation.
    APRA supervises prudentially, and the Consumer Data Right that already
    opened banking and energy was designated to extend to general insurance and
    then deferred and de-prioritised — so the CDR seam that made Australian
    banking legible stops before insurance, and stops well before life
    insurance. TAL sits squarely in that gap: a dominant carrier with no
    regulatory forcing function to publish anything, and no commercial reason to
    self-serve when its distribution is advisers, super funds and named
    partners. Its most API-shaped asset is not its own — backd by TAL is built
    on Cover Genius, the Sydney embedded-insurance company that does publish a
    real API, and even that consumer brand currently serves a placeholder page.
sources:
- url: https://www.tal.com.au/
  type: Website
  note: Corporate marketing site. Probed 2026-07-25, HTTP 200.
- url: https://www.tal.com.au/about-us
  type: About
  note: Ownership (Dai-ichi Life Group), legal entity TAL Life Limited ABN 70 050
    109 450 AFSL 237848, "$4.7 billion in benefits to 57,000 customers",
    "Australia's largest life insurer" per NMG Consulting (2023). Fetched
    2026-07-25.
- url: https://adviser.tal.com.au/
  type: PartnerPortal
  note: TAL Adviser Centre. Login-gated adviser portal; navigation is Products,
    Risk Academy, Claims, Tools & Resources, Our Team, Latest News. No API,
    integration, data feed, ACORD or XML material. Fetched 2026-07-25, HTTP 200.
- url: https://www.tal.com.au/adviser-partners
  type: Documentation
  note: '"Our dedicated adviser portal provides you with tools to make doing
    business with TAL easy: from quoting and application, through to managing
    existing business and making a claim." No third-party software, API or
    standards integration is named. Fetched 2026-07-25.'
- url: https://www.tal.com.au/about-us/media-centre/cover-genius-tal-partnership
  type: Press
  note: Announces backd by TAL with Cover Genius — payroll-embedded life, income
    and illness protection, "no underwriting and 100% digital claims". Describes
    "embedding it into their existing HR or payroll platform" but names no API,
    no XCover integration and no technical specification. Fetched 2026-07-25.
- url: https://www.tal.com.au/sitemap.xml
  type: Sitemap
  note: 556 URLs. No developer, API or documentation section. Fetched 2026-07-25.
- url: https://www.tal.com.au/llms.txt
  type: LLMsTxt
  note: Real published llms.txt, 71,463 bytes, last modified 2026-06-29. Curates
    the marketing sitemap for LLM crawlers under Primary Information, Blog and
    Editorial, Products / Services / Collections, Support and Purchase Guidance,
    Policies and Optional headings. Harvested verbatim on 2026-07-25.
- url: https://crt.sh/?q=%25.tal.com.au
  type: CertificateTransparency
  note: 832 distinct certificate names for *.tal.com.au. The source that
    surfaced the partner API estate (partner.api, iress.api, liferisk.api,
    omnium.api, the glsb2b family, the URE GraphQL hosts) and the internalised
    developer-portal hostnames. Enumerated 2026-07-25.
- url: https://login.talpartner.tal.com.au/.well-known/openid-configuration
  type: OpenIDConnect
  note: TAL's partner identity tenant. Full OIDC discovery, HTTP 200, harvested
    verbatim 2026-07-25.
- url: https://common.glsb2b.tal.com.au/
  type: API
  note: 'Group Life B2B common service. HTTP 401 with WWW-Authenticate: Bearer
    realm="app-b2bcommon-prodmel.azurewebsites.net". Probed 2026-07-25.'
actions:
  apisYmlUpdated: true
  openapiDirectoryCreated: false
  reason: |
    Round one recorded an honest stub with an empty apis[]. The 2026-07-25
    enrichment round replaced that with three real, verified API entries — the
    partner OpenID Connect tenant, the Group Life B2B estate and the URE
    GraphQL endpoint — each explicitly marked as gated, because they are live
    TAL APIs even though none is documented or self-serve. openapi/ stays
    absent: no OpenAPI, Swagger, AsyncAPI or .proto exists anywhere on a
    TAL-controlled host.
  enrichmentRounds:
  - date: '2026-07-25'
    method: search + probe + derive
    added:
    - llms/tal-australia-llms.txt (searched, verbatim)
    - well-known/ index plus four harvested OIDC / OAuth metadata documents
    - authentication/tal-australia-authentication.yml (searched)
    - scopes/tal-australia-scopes.yml (searched)
    - graphql/tal-australia-ure-graphql.yml (searched, SDL gated)
    - conformance/tal-australia-conformance.yml (derived)
    - errors/tal-australia-error-codes.yml (derived from observed envelopes)
    - conventions/tal-australia-conventions.yml (derived)
    - lifecycle/tal-australia-lifecycle.yml (derived)
    - packages/tal-australia-packages.yml (searched, empty by result)
    - security/tal-australia-domain-security.yml (probed)
    notFound:
    - OpenAPI / Swagger / AsyncAPI / Protobuf
    - security.txt, trust centre, vulnerability disclosure or bug bounty
    - status page, changelog, deprecation policy, SLA
    - MCP server, agent skills, CLI, SDKs, Postman collection, embedded
      components, published sandbox
    - webhooks or any event surface
