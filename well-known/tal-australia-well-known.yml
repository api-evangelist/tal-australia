    status: 200
    file: tal-australia-talpartner-openid-configuration.json
  - path: /.well-known/oauth-authorization-server
    status: 200
    file: tal-australia-talpartner-oauth-authorization-server.json
  - path: /oauth2/default/.well-known/openid-configuration
    status: 200
    note: Okta stock "default" authorization server (issuer
      https://talpartner-au.okta.com/oauth2/default); its scopes_supported are
      Okta platform scopes (okta.myAccount.*), not TAL business scopes, so it is
      recorded but not harvested.
  - path: /oauth2/v1/keys
    status: 200
    note: JWKS. Not stored — key material rotates.
