method: searched
source: live probes of /.well-known/* across every TAL-controlled host discovered
  via certificate transparency (crt.sh) and apis.yml
note: |
  TAL publishes no /.well-known/ surface on its consumer or corporate hosts, but
  three TAL-branded Okta identity tenants serve full, anonymous OpenID Connect
  discovery documents. Those are the only machine-readable API contracts TAL
  exposes publicly, and they describe how partners authenticate to the gated
  partner API estate rather than the business APIs themselves.
hosts:
