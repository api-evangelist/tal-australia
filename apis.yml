apis:
- name: TAL Partner Identity
  description: >-
    TAL's partner-facing OpenID Connect identity tenant (Okta org
    talpartner-au.okta.com), and the only machine-readable API contract TAL
    serves anonymously. Full OIDC discovery and RFC 8414 authorization-server
    metadata return 200, advertising authorization-code with PKCE (S256),
    device code, CIBA, refresh tokens, pushed authorization requests and DPoP,
    plus introspection, revocation and logout endpoints. It authenticates
    partner applications into TAL's gated API estate; TAL operates no open
    client registration, so obtaining a client requires a partner agreement.
    Two sibling tenants exist for ACP (auth.acp.tal.com.au) and TAL Claims
    Assist (auth.claimsassist.tal.com.au).
  humanURL: https://www.tal.com.au/adviser-partners
  baseURL: https://login.talpartner.tal.com.au
  tags:
  - Identity
  - OpenID Connect
  - OAuth 2.0
  - Partner
  properties:
  - type: OpenIDConnect
    url: https://login.talpartner.tal.com.au/.well-known/openid-configuration
  - type: WellKnown
    url: well-known/tal-australia-well-known.yml
  - type: Authentication
    url: authentication/tal-australia-authentication.yml
  - type: OAuthScopes
    url: scopes/tal-australia-scopes.yml
- name: TAL Group Life B2B (glsb2b)
  description: >-
    The integration estate behind TAL's group insurance business with
    superannuation funds — underwriting in/out (uwin, uwout), claims in/out
    (claimsin, claimsout), a common service, a delivery service and clpapi,
    all under glsb2b.tal.com.au. The common service is an ASP.NET application
    on Azure App Service that answers anonymous requests with HTTP 401 and
    WWW-Authenticate Bearer, confirming an OAuth 2.0 bearer-protected API
    rather than a website; the delivery service is an Azure Function App. No
    OpenAPI, Swagger UI or documentation is served — every discovery path
    returns 401. Access is bilateral, negotiated per fund administrator.
  humanURL: https://www.grouphq.tal.com.au/
  baseURL: https://common.glsb2b.tal.com.au
  tags:
  - Group Insurance
  - Superannuation
  - Underwriting
  - Claims
  - Partner
  properties:
  - type: Authentication
    url: authentication/tal-australia-authentication.yml
  - type: ErrorCatalog
    url: errors/tal-australia-error-codes.yml
- name: TAL Underwriting Rules Engine (URE) GraphQL
  description: >-
    A live production GraphQL endpoint serving TAL's Underwriting Rules
    Engine. It answers anonymous POSTs and reports a query root type of
    CaseQuery with no mutation or subscription type, but field-level
    introspection is filtered — types and fields return empty — so no SDL can
    be captured and none is fabricated here. It is linked from nothing and
    documented nowhere; it was located by enumerating certificate transparency
    records for tal.com.au. Sibling hosts cover UAT, the Individual Life and
    Group underwriting engines, and the URE single-page app.
  humanURL: https://www.tal.com.au/adviser-partners
  baseURL: https://ure-prod-graphql-app.tal.com.au/graphql
  tags:
  - GraphQL
  - Underwriting
  - Rules Engine
  properties:
  - type: GraphQL
    url: graphql/tal-australia-ure-graphql.yml
  - type: ErrorCatalog
    url: errors/tal-australia-error-codes.yml
